name: Docker Build, Push, and Deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      # ----------------------------------------------------
      # 1. CHECKOUT
      # ----------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------
      # 2. LOGIN TO GHCR (unchanged)
      # ----------------------------------------------------
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------
      # 3. METADATA FOR GHCR TAGS
      # ----------------------------------------------------
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      # ----------------------------------------------------
      # 4. BUILD & PUSH TO GHCR (unchanged)
      # ----------------------------------------------------
      - name: Build and push Docker image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ./HotelListing.API
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # =====================================================================
      #                     GOOGLE CLOUD RUN SECTION
      # =====================================================================

      # ----------------------------------------------------
      # 5. AUTHENTICATE TO GOOGLE CLOUD
      # ----------------------------------------------------
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCLOUD_SERVICE_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      # ----------------------------------------------------
      # 6. CONFIGURE DOCKER FOR ARTIFACT REGISTRY
      # ----------------------------------------------------
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      # ----------------------------------------------------
      # 7. BUILD & PUSH IMAGE TO ARTIFACT REGISTRY
      # ----------------------------------------------------
      - name: Build and push to Google Artifact Registry
        run: |
          IMAGE="us-central1-docker.pkg.dev/project-central-america/hotellisting/hotellisting-api"
          docker build -t $IMAGE:latest -t $IMAGE:${{ github.sha }} ./HotelListing.API
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}

      # ----------------------------------------------------
      # 8. DEPLOY TO CLOUD RUN
      # ----------------------------------------------------
      - name: Deploy to Cloud Run
        run: |
          IMAGE="us-central1-docker.pkg.dev/project-central-america/hotellisting/hotellisting-api:${{ github.sha }}"
          gcloud run deploy hotellisting-api \
            --image $IMAGE \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated \
            --quiet

      # =====================================================================
      #                     END GOOGLE CLOUD RUN SECTION
      # =====================================================================
